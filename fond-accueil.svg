<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 680" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061a2e"/>
      <stop offset=".38" stop-color="#0d3558"/>
      <stop offset=".62" stop-color="#2b6688"/>
      <stop offset=".74" stop-color="#c9825a"/>
      <stop offset=".78" stop-color="#f2b46e"/>
    </linearGradient>
    <linearGradient id="lac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5f80"/>
      <stop offset=".35" stop-color="#14466b"/>
      <stop offset="1" stop-color="#0a2740"/>
    </linearGradient>
    <radialGradient id="halo" cx="322" cy="528" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd59a" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#f2a066" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f2a066" stop-opacity="0"/>
