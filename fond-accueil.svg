    <linearGradient id="montLoin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6f95"/>
      <stop offset="1" stop-color="#8a7a8f"/>
    </linearGradient>
    <linearGradient id="montPres" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223f63"/>
      <stop offset="1" stop-color="#173251"/>
    </linearGradient>
  </defs>

  <!-- ciel -->
  <rect width="390" height="680" fill="url(#ciel)"/>
  <g fill="#fff">
    <circle cx="28" cy="40" r=".9" opacity=".8"/><circle cx="70" cy="92" r=".7" opacity=".6"/><circle cx="118" cy="30" r="1" opacity=".7"/>
    <circle cx="160" cy="120" r=".6" opacity=".5"/><circle cx="212" cy="58" r=".9" opacity=".8"/><circle cx="252" cy="140" r=".6" opacity=".5"/>
    <circle cx="300" cy="34" r="1.1" opacity=".9"/><circle cx="342" cy="96" r=".7" opacity=".6"/><circle cx="372" cy="170" r=".6" opacity=".5"/>
    <circle cx="44" cy="190" r=".6" opacity=".4"/><circle cx="190" cy="200" r=".5" opacity=".35"/><circle cx="96" cy="250" r=".5" opacity=".3"/>
    <circle cx="330" cy="236" r=".5" opacity=".3"/>
  </g>

  <!-- soleil couchant -->
  <rect width="390" height="680" fill="url(#halo)"/>

  <!-- Alpes lointaines -->
  <path d="M0 500 L26 478 L48 486 L74 458 L96 472 L120 450 L150 476 L178 462 L206 482 L236 466 L262 486 L290 474 L320 492 L350 478 L390 494 L390 532 L0 532 Z" fill="url(#montLoin)" opacity=".75"/>
  <!-- Dents du Midi et Chablais -->
  <path d="M0 512 L30 492 L52 500 L78 470 L88 476 L98 458 L106 468 L114 452 L124 466 L134 456 L146 474 L170 490 L200 480 L230 498 L262 494 L290 508 L330 502 L360 512 L390 506 L390 532 L0 532 Z" fill="url(#montPres)"/>
  <path d="M94 464 L98 458 L102 463 L106 468 L110 459 L114 452 L119 460 L124 466 L129 460 L134 456 L139 463 L134 462 L129 466 L124 470 L119 464 L114 458 L110 466 L106 472 L102 468 L98 464 Z" fill="#e9eef6" opacity=".8"/>

  <circle cx="322" cy="530" r="24" fill="#ffd28c"/>
  <!-- lac -->
  <rect y="530" width="390" height="150" fill="url(#lac)"/>
  <rect y="529" width="390" height="2" fill="#f6c07a" opacity=".55"/>
  <!-- reflet du soleil -->
  <g fill="#f8c27f">
    <rect x="270" y="540" width="60" height="3" rx="1.5" opacity=".85"/>
    <rect x="278" y="551" width="44" height="3" rx="1.5" opacity=".7"/>
    <rect x="285" y="562" width="30" height="3" rx="1.5" opacity=".55"/>
    <rect x="291" y="573" width="18" height="2.5" rx="1.25" opacity=".4"/>
