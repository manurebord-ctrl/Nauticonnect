    <path d="M20 600 q10 -4 20 0 t20 0"/><path d="M120 620 q10 -4 20 0 t20 0"/><path d="M60 650 q10 -4 20 0 t20 0"/>
    <path d="M200 640 q10 -4 20 0 t20 0"/><path d="M330 620 q10 -4 20 0 t20 0"/><path d="M250 665 q10 -4 20 0 t20 0"/>
